<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دعوة زفاف تفاعلية</title>
    <!-- استيراد الخطوط -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;700&display=swap');

        body {
            margin: 0;
            background-color: #fcf9f2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Cairo', sans-serif;
            overflow-x: hidden;
        }

        /* الإطار البيضاوي للصورة */
        .oval-frame {
            width: 300px;
            height: 400px;
            border-radius: 50%; /* يجعل الشكل بيضاوياً بناءً على الأبعاد */
            border: 5px solid #d4af37; /* إطار ذهبي */
            position: relative;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
            margin-top: 20px;
        }

        /* الصورة الأساسية الواضحة (خلفية الإطار) */
        .oval-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* الكانفاس الذي سيحتوي على الطبقة المضببة */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            cursor: pointer;
            transition: opacity 1.5s ease; /* تأثير تلاشي ناعم عند انتهاء المسح */
        }

        /* نص الإرشاد فوق الصورة */
        .instruction {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ffffff;
            font-size: 1.2rem;
            font-weight: bold;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.8);
            z-index: 3;
            pointer-events: none; /* لمنع النص من إعاقة المسح */
            transition: opacity 0.5s ease;
            text-align: center;
            width: 100%;
        }

        /* تفاصيل الدعوة التي ستظهر لاحقاً */
        .invitation-details {
            opacity: 0;
            transform: translateY(30px);
            transition: all 1.5s ease;
            text-align: center;
            margin-top: 40px;
            padding: 0 20px;
        }

        /* الصنف الذي سيتم إضافته لإظهار التفاصيل */
        .invitation-details.show {
            opacity: 1;
            transform: translateY(0);
        }

        .names {
            font-family: 'Amiri', serif;
            font-size: 2.2rem;
            color: #d4af37;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .message {
            font-size: 1.1rem;
            color: #555;
            line-height: 1.8;
        }
    </style>
</head>
<body>

    <!-- المنطقة التفاعلية (الإطار البيضاوي) -->
    <div class="oval-frame">
        <!-- ضع رابط صورة العروسين الحقيقية في خاصية src أدناه -->
        <img id="couple-image" src="https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=400&q=80" alt="العروسين">
        <canvas id="scratch-canvas"></canvas>
        <div class="instruction" id="instruction-text">امسح بإصبعك لاكتشاف الدعوة</div>
    </div>

    <!-- المرفقات والتفاصيل التي ستظهر بعد المسح -->
    <div class="invitation-details" id="details-section">
        <div class="names">أحمد & فاطمة</div>
        <div class="message">
            يسعدنا أن تشاركونا أجمل لحظات عمرنا<br>
            <strong>الخميس، 15 أكتوبر 2026</strong><br>
            قاعة الأفراح الكبرى - المدينة
        </div>
    </div>

    <script>
        const canvas = document.getElementById('scratch-canvas');
        const ctx = canvas.getContext('2d');
        const img = document.getElementById('couple-image');
        const instruction = document.getElementById('instruction-text');
        const details = document.getElementById('details-section');

        // ضبط أبعاد الكانفاس لتتطابق مع الإطار
        canvas.width = 300;
        canvas.height = 400;

        let isDrawing = false;
        let wipeCount = 0; // عداد لمعرفة كمية المسح
        let isRevealed = false; // حالة الدعوة

        // دالة لرسم الصورة المضببة على الكانفاس عند تحميل الصفحة
        function initCanvas() {
            // إضافة تأثير التضبيب بنسبة كبيرة
            ctx.filter = 'blur(25px)';
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            
            // إضافة طبقة بيضاء خفيفة فوق الصورة المضببة لإبراز نص الإرشاد
            ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // إعادة ضبط الفلتر حتى لا يؤثر على عملية المسح
            ctx.filter = 'none';
        }

        // إذا تم تحميل الصورة مسبقاً
        if (img.complete) {
            initCanvas();
        } else {
            img.onload = initCanvas;
        }

        // بدء عملية المسح
        function startDrawing(e) {
            if (isRevealed) return;
            isDrawing = true;
            instruction.style.opacity = '0'; // إخفاء نص "امسح بإصبعك" فوراً
            draw(e);
        }

        // إنهاء عملية المسح (رفع الإصبع)
        function stopDrawing() {
            isDrawing = false;
            ctx.beginPath();
            checkCompletion(); // التحقق مما إذا كان المستخدم مسح جزءاً كافياً
        }

        // دالة المسح (التي تجعل الأجزاء الممسوحة شفافة)
        function draw(e) {
            if (!isDrawing || isRevealed) return;
            e.preventDefault(); // منع تدرج الشاشة أثناء المسح بالهاتف

            const rect = canvas.getBoundingClientRect();
            let x, y;

            // تحديد إحداثيات اللمس أو الماوس
            if (e.type.includes('touch')) {
                x = e.touches[0].clientX - rect.left;
                y = e.touches[0].clientY - rect.top;
            } else {
                x = e.clientX - rect.left;
                y = e.clientY - rect.top;
            }

            // إعدادات فرشاة المسح
            ctx.lineWidth = 45; // حجم الإصبع/الفرشاة
            ctx.lineCap = 'round';
            ctx.globalCompositeOperation = 'destination-out'; // هذا الأمر يحذف ما يتم رسمه ويكشف ما تحته

            ctx.lineTo(x, y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(x, y);

            // زيادة العداد مع كل حركة
            wipeCount++;
            
            // إذا تجاوز العداد حد معين، نعتبر أن الزائر مسح كفاية
            if (wipeCount > 70) {
                checkCompletion();
            }
        }

        // أحداث الماوس لأجهزة الكمبيوتر
        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseleave', stopDrawing);

        // أحداث اللمس للهواتف الذكية
        canvas.addEventListener('touchstart', startDrawing, { passive: false });
        canvas.addEventListener('touchend', stopDrawing);
        canvas.addEventListener('touchmove', draw, { passive: false });

        // دالة إظهار التفاصيل المخفية عند اكتمال المسح
        function checkCompletion() {
            if (isRevealed) return;
            
            // إذا كان المستخدم قد حرك إصبعه عدد مرات كافٍ
            if (wipeCount > 80) {
                isRevealed = true;
                
                // إخفاء الكانفاس بالكامل بتأثير ناعم
                canvas.style.opacity = '0';
                
                // إظهار تفاصيل الدعوة بعد ثانية واحدة
                setTimeout(() => {
                    canvas.style.display = 'none';
                    details.classList.add('show');
                }, 500);
            }
        }
    </script>

</body>
</html>
